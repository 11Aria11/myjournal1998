<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Journal 1998</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F2F4F8;
    --surface: #FFFFFF;
    --surface-muted: #E8EBF1;
    --ink: #2B303A;
    --ink-soft: #5C6472;
    --ink-faint: #9099A8;
    --border: #DBDFE7;
    --border-strong: #C3C9D4;

    --sky: #55779E;
    --sky-100: #E4EBF3;
    --sky-600: #3E5A7C;
    --sky-800: #2A3F58;

    --dusk: #4B5563;
    --dusk-100: #E9EBEE;
    --dusk-600: #3A4149;

    --sage: #5C8A6E;
    --sage-100: #E4EFE7;
    --sage-700: #33553F;

    --clay: #C9694A;
    --clay-100: #F7E5DF;
    --clay-700: #7C3821;

    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 22px;

    --font-display: "Fraunces", serif;
    --font-body: "Inter", sans-serif;
  }

  *{ box-sizing: border-box; }
  body{
    margin:0;
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .shell{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 32px 16px 64px;
  }

  .devbar{
    width:100%;
    max-width: 980px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom: 28px;
    padding: 10px 18px;
    background: var(--surface);
    border:0.5px solid var(--border);
    border-radius: var(--radius-md);
    flex-wrap: wrap;
  }
  .devbar-title{
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 500;
    color: var(--ink-soft);
  }
  .devbar-links{ display:flex; gap:6px; flex-wrap:wrap; }
  .devbar-links button{
    font-family: var(--font-body);
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 999px;
    border: 0.5px solid var(--border);
    background: var(--surface);
    color: var(--ink-soft);
    cursor:pointer;
  }
  .devbar-links button:hover{ background: var(--surface-muted); }
  .devbar-links button.active{
    background: var(--ink);
    color: var(--surface);
    border-color: var(--ink);
  }

  .phone{
    width: 380px;
    max-width: 100%;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(43,48,58,0.04), 0 12px 32px rgba(43,48,58,0.06);
    display:flex;
    flex-direction:column;
    min-height: 700px;
  }

  .screen{ display:flex; flex-direction:column; flex:1; min-height:700px; }

  /* ---------- shared bits ---------- */
  .pad{ padding: 24px 22px; }
  .center-pad{ padding: 40px 26px; text-align:center; }

  .brand-mark{
    display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom: 8px;
  }
  .brand-mark svg{ width:40px; height:40px; }
  .brand-name{ font-family: var(--font-display); font-size: 20px; font-weight:500; margin:0; }
  .brand-tag{ font-size: 13px; color: var(--ink-soft); margin:0; }

  h1.h{ font-family: var(--font-display); font-weight:500; font-size:21px; margin:0 0 6px; }
  p.sub{ font-size: 13.5px; color: var(--ink-soft); margin:0; line-height:1.6; }

  label.field-label{ font-size:12.5px; color: var(--ink-soft); display:block;
